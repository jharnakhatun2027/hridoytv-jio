name: Auto Update M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘণ্টা পরপর অটোমেটিক রান হবে
  workflow_dispatch:        # GitHub থেকে ম্যানুয়ালি রান করার অপশন

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Generate M3U File
      run: python generate_m3u.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist.m3u" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
